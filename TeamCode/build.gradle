// The simulator: flavours, test setup, staged config and the dashboard task.
// https://github.com/ngi-collective/ftc-sim
plugins {
    id 'org.ngi-collective.ftc-sim' version '12.0.5'
}

apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

ftcSim {
    version = '12.0.5'
    season = 'biobuzz'
    seasonVersion = '1.0.0'
}

dependencies {
    implementation project(':FtcRobotController')
}

// The AUTO tests run in real time, because the OpModes time their shots and waits by the wall
// clock, so most of a test run is waiting. Four JVMs run four test classes at once; the AUTO tests
// are split two to a class for that reason. That is all an 8-core machine holds: in the sim an
// OpMode loop never waits on hardware and spins a core, so more forks starve the real-time runs,
// and the symptom is parks stalling and routines overrunning 30 s, failures that look like bugs.
tasks.withType(Test).configureEach {
    maxParallelForks = 4
    // A fresh JVM per test class. VisionPortal counts portals per process and the SDK keeps
    // static camera state, so a portal left by one class (a tip-aware AUTO stopped mid-run)
    // failed whichever vision class its fork ran next: "multiple vision portals", or a range
    // read off the wrong camera. Which classes shared a fork changed run to run.
    forkEvery = 1
}
